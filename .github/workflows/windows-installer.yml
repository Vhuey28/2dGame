name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      display_version:
        description: Optional installer version (defaults to the Maven version)
        required: false
        type: string
  push:
    branches:
      - "arena/**"
    paths:
      - ".github/workflows/windows-installer.yml"
      - "jpackage.ps1"
      - "pom.xml"

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Show build tools
        shell: pwsh
        run: |
          java -version
          mvn -version
          jpackage --version

      - name: Run jpackage.ps1
        shell: pwsh
        run: |
          $version = "${{ inputs.display_version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            .\jpackage.ps1
          } else {
            .\jpackage.ps1 $version
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ChronicleConquest-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
