name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]   # adjust if your default branch has a different name
  workflow_dispatch:     # lets you manually trigger a deploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'       # match whatever your pom.xml targets
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Prepare Pages site folder
        run: |
          mkdir -p site
          cp target/my2Dgame-1.0.0.jar site/
          ls -la site/
          cp web/index.html site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4