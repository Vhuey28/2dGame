name: Java CI

on:
  push:
    branches:
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile and test
        run: |
          set -o pipefail
          mvn -B test 2>&1 | tee maven-test.log
      - name: Upload Maven test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-log
          path: maven-test.log
