<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Chronicle Conquest</title>
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
    <style>
    body {
        margin: 0;
        overflow: hidden;
        display: flex;
        justify-content: center; /* Center horizontally */
        align-items: center; /* Center vertically */
        height: 100vh; /* Full viewport height */
    }
    #cheerpjDisplay {
        width: 768px;
        height: 576px;
        background-color: #020303; /* Optional: add a background color for better visibility */
    }
    </style>
<div id="cheerpjDisplay"></div>        
<script>
    (async () => {
        await cheerpjInit({ version: 17, javaProperties: ["chronicle.webmode=true"]});
        cheerpjCreateDisplay(768, 576);
        const jarDir = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
        await cheerpjRunJar("/app" + jarDir + "my2Dgame-1.0.0.jar");
     })();
</script>
</body>
</html>
